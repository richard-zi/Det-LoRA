[project]
name = "det-lora"
version = "0.1.0"
description = "Det-LoRA: Parameter-Efficient Continual Learning for Object Detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Richard Zimmermann" }
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "transformers>=4.40.0",
    "peft>=0.12.0",
    "accelerate>=0.30.0",
    "pycocotools>=2.0.0",
    "tqdm>=4.65.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
    "pandas>=2.0.0",
    "optuna>=3.0.0",
    "scipy>=1.15.3",
    "rfdetr>=1.5.2",
]

[project.urls]
Repository = "https://github.com/richard-zi/Det-LoRA"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/det_lora"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "black>=25.9.0",
    "isort>=5.13.0",
    "mypy>=1.14.0",
]
